<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>IBEA — Sistema de Gestão de Emendas</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ══════════════════════════════════════════════════════════════════
   ESTILOS GLOBAIS & TEMA
   ══════════════════════════════════════════════════════════════════ */
:root {
  --navy: #1B2A4A; --navy2: #243658; --gold: #C5A55A; --gold2: #D4B96E;
  --gold-bg: rgba(197,165,90,.08); --bg: #F3F4F8; --bg2: #FFF; --bg3: #E8EBF0;
  --card: #FFF; --card2: #F7F8FB; --tx: #1A1D26; --tx2: #4A5068; --tx3: #8890A4;
  --border: #DEE1EA; --border2: #ECEEF3; --green: #1EA85A; --green-bg: rgba(30,168,90,.1);
  --yellow: #D9960A; --yellow-bg: rgba(217,150,10,.1); --orange: #D06818; --orange-bg: rgba(208,104,24,.1);
  --red: #C82838; --red-bg: rgba(200,40,56,.1); --blue: #2E6EE6; --blue-bg: rgba(46,110,230,.1);
  --purple: #7C4DCC; --purple-bg: rgba(124,77,204,.1);
  --r: 10px; --r-sm: 6px; --r-lg: 14px;
  --sh: 0 1px 3px rgba(0,0,0,.06); --sh-lg: 0 6px 24px rgba(0,0,0,.1);
  --sidebar-w: 260px; --font: 'DM Sans', system-ui, sans-serif; --mono: 'JetBrains Mono', monospace;
}
[data-theme="dark"] {
  --bg: #0C0F16; --bg2: #14181F; --bg3: #1C2028; --card: #171B24; --card2: #1E222C;
  --tx: #E0E3EA; --tx2: #9CA3B8; --tx3: #606878; --border: #262C38; --border2: #202630;
  --sh: 0 1px 3px rgba(0,0,0,.2); --sh-lg: 0 6px 24px rgba(0,0,0,.35);
  --gold-bg: rgba(197,165,90,.1); --green-bg: rgba(30,168,90,.14); --yellow-bg: rgba(217,150,10,.14);
  --orange-bg: rgba(208,104,24,.14); --red-bg: rgba(200,40,56,.14); --blue-bg: rgba(46,110,230,.14);
  --purple-bg: rgba(124,77,204,.14);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: var(--font); background: var(--bg); color: var(--tx); display: flex; min-height: 100vh; transition: background .3s, color .3s; }
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
button { font-family: inherit; cursor: pointer; border: none; outline: none; }
input, select, textarea { font-family: inherit; font-size: .84rem; border: 1.5px solid var(--border); background: var(--bg2); color: var(--tx); border-radius: var(--r-sm); padding: 9px 12px; width: 100%; transition: border .2s, box-shadow .2s; }
input:focus, select:focus, textarea:focus { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(197,165,90,0.12); outline: none; }
label { display: block; font-size: .7rem; font-weight: 700; color: var(--tx2); margin-bottom: 4px; text-transform: uppercase; letter-spacing: .6px; }
a { color: var(--gold); text-decoration: none; cursor: pointer; } a:hover { text-decoration: underline; }

/* ══════════════════════════════════════════════════════════════════
   LAYOUT SHELL (SIDEBAR + MAIN)
   ══════════════════════════════════════════════════════════════════ */
.sb { width: var(--sidebar-w); background: var(--navy); display: flex; flex-direction: column; position: fixed; top: 0; left: 0; bottom: 0; z-index: 100; transition: transform .3s; }
.sb-brand { padding: 18px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid rgba(255,255,255,0.08); }
.sb-logo { width: 42px; height: 42px; border-radius: 10px; background: var(--gold); display: flex; align-items: center; justify-content: center; font-weight: 800; color: var(--navy); font-size: 1rem; flex-shrink: 0; overflow: hidden; }
.sb-logo img { width: 100%; height: 100%; object-fit: cover; }
.sb-brand-t { font-size: .78rem; line-height: 1.35; color: rgba(255,255,255,0.8); } .sb-brand-t strong { display: block; font-size: .88rem; color: var(--gold); }
.sb-nav { flex: 1; padding: 10px 8px; overflow-y: auto; }
.sb-sec { font-size: .62rem; text-transform: uppercase; letter-spacing: 1.2px; color: rgba(255,255,255,0.25); padding: 18px 14px 6px; font-weight: 700; }
.ni { display: flex; align-items: center; gap: 10px; padding: 9px 14px; border-radius: var(--r); color: rgba(255,255,255,0.6); font-size: .82rem; font-weight: 500; cursor: pointer; transition: all .15s; margin-bottom: 1px; position: relative; }
.ni:hover { background: rgba(255,255,255,0.06); color: #fff; }
.ni.act { background: rgba(197,165,90,0.18); color: var(--gold); }
.ni svg { width: 17px; height: 17px; flex-shrink: 0; opacity: 0.65; } .ni.act svg { opacity: 1; }
.ni-badge { position: absolute; right: 10px; background: var(--red); color: #fff; font-size: .6rem; padding: 1px 6px; border-radius: 10px; font-weight: 700; min-width: 18px; text-align: center; }
.sb-ft { padding: 12px 16px; border-top: 1px solid rgba(255,255,255,0.06); font-size: .65rem; color: rgba(255,255,255,0.3); text-align: center; }

.mn { margin-left: var(--sidebar-w); flex: 1; display: flex; flex-direction: column; min-height: 100vh; }
.tb { display: flex; align-items: center; justify-content: space-between; padding: 10px 28px; background: var(--bg2); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 50; }
.tb-t { font-size: 1.05rem; font-weight: 700; } .tb-a { display: flex; align-items: center; gap: 8px; }
.btn-t { width: 34px; height: 34px; border-radius: 50%; background: var(--bg3); display: flex; align-items: center; justify-content: center; color: var(--tx2); transition: all .2s; }
.btn-t:hover { background: var(--gold-bg); color: var(--gold); }
.btn-h { width: 28px; height: 28px; border-radius: 50%; background: var(--yellow); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: .85rem; margin-left: 8px; box-shadow: 0 2px 6px rgba(217,150,10,0.3); }
.btn-h:hover { transform: scale(1.1); background: var(--gold); }
.perfil-chip { display: flex; align-items: center; gap: 6px; padding: 5px 12px; border-radius: 20px; font-size: .78rem; font-weight: 700; cursor: pointer; transition: all .2s; border: 1.5px solid var(--border); }
.ct { flex: 1; padding: 22px 28px; }

/* ══════════════════════════════════════════════════════════════════
   COMPONENTES COMUNS (BUTTONS, CARDS, TABLES, MODALS)
   ══════════════════════════════════════════════════════════════════ */
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 18px; border-radius: var(--r-sm); font-size: .82rem; font-weight: 600; transition: all .15s; white-space: nowrap; }
.btn-p { background: var(--gold); color: var(--navy); } .btn-p:hover { background: var(--gold2); box-shadow: 0 2px 8px rgba(197,165,90,0.3); }
.btn-s { background: var(--bg3); color: var(--tx2); } .btn-s:hover { background: var(--border); }
.btn-green { background: var(--green); color: #fff; } .btn-red { background: var(--red); color: #fff; }
.btn-sm { padding: 5px 12px; font-size: .76rem; }
.btn-i { width: 30px; height: 30px; padding: 0; justify-content: center; border-radius: var(--r-sm); background: var(--bg3); color: var(--tx2); display: inline-flex; align-items: center; font-size: .85rem; }
.btn-i:hover { background: var(--gold-bg); color: var(--gold); }

.g { display: grid; gap: 14px; } .g2 { grid-template-columns: 1fr 1fr; } .g3 { grid-template-columns: 1fr 1fr 1fr; } .g4 { grid-template-columns: 1fr 1fr 1fr 1fr; }
@media(max-width: 900px) { .g2, .g3, .g4 { grid-template-columns: 1fr; } }
.fld { display: flex; flex-direction: column; }
.sep { font-size: .88rem; font-weight: 700; color: var(--navy); margin: 22px 0 12px; padding-bottom: 8px; border-bottom: 2px solid var(--gold-bg); display: flex; align-items: center; gap: 8px; }
[data-theme="dark"] .sep { color: var(--gold); }

/* KPI CARDS */
.kpi-g { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 14px; margin-bottom: 22px; }
.kpi { background: var(--card); border: 1.5px solid var(--border2); border-radius: var(--r-lg); padding: 16px 18px; transition: all .2s; cursor: default; position: relative; overflow: hidden; }
.kpi::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: var(--gold); }
.kpi-lb { font-size: .68rem; text-transform: uppercase; letter-spacing: .7px; color: var(--tx3); font-weight: 700; margin-bottom: 4px; }
.kpi-vl { font-size: 1.4rem; font-weight: 800; line-height: 1.1; } .kpi-sb { font-size: .72rem; color: var(--tx3); margin-top: 4px; }
.kpi.clickable { cursor: pointer; } .kpi.clickable:hover { border-color: var(--gold); transform: translateY(-2px); box-shadow: var(--sh-lg); }

/* BADGES */
.badge { font-size: .65rem; padding: 2px 8px; border-radius: 20px; font-weight: 700; text-transform: uppercase; white-space: nowrap; }
.b-green { background: var(--green-bg); color: var(--green); } .b-yellow { background: var(--yellow-bg); color: var(--yellow); }
.b-orange { background: var(--orange-bg); color: var(--orange); } .b-red { background: var(--red-bg); color: var(--red); }
.b-blue { background: var(--blue-bg); color: var(--blue); } .b-gray { background: var(--bg3); color: var(--tx3); }
.b-purple { background: var(--purple-bg); color: var(--purple); }

/* TABLES */
.tbl-w { overflow-x: auto; border: 1px solid var(--border2); border-radius: var(--r-lg); background: var(--card); }
.tbl { width: 100%; border-collapse: collapse; font-size: .8rem; }
.tbl th { background: var(--navy); color: #fff; padding: 10px 12px; text-align: left; font-weight: 600; font-size: .7rem; text-transform: uppercase; letter-spacing: .5px; white-space: nowrap; }
[data-theme="dark"] .tbl th { background: var(--navy2); }
.tbl td { padding: 9px 12px; border-bottom: 1px solid var(--border2); vertical-align: middle; }
.tbl tr:hover td { background: var(--gold-bg); } .tbl .mono { font-family: var(--mono); font-size: .78rem; }

/* MODALS */
.mo { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 200; align-items: center; justify-content: center; padding: 16px; }
.mo.open { display: flex; }
.mo-c { background: var(--card); border-radius: var(--r-lg); width: 100%; max-width: 800px; max-height: 92vh; overflow-y: auto; box-shadow: var(--sh-lg); }
.mo-h { display: flex; align-items: center; justify-content: space-between; padding: 16px 22px; border-bottom: 1px solid var(--border); position: sticky; top: 0; background: var(--card); z-index: 1; border-radius: var(--r-lg) var(--r-lg) 0 0; }
.mo-h h3 { font-size: .98rem; font-weight: 700; } .mo-b { padding: 18px 22px; } .mo-f { display: flex; justify-content: flex-end; gap: 8px; padding: 14px 22px; border-top: 1px solid var(--border); }

/* ALERTS */
.al { display: flex; align-items: flex-start; gap: 10px; padding: 10px 14px; border-radius: var(--r); margin-bottom: 12px; font-size: .8rem; border-left: 3px solid; }
.al-w { background: var(--yellow-bg); color: var(--yellow); border-color: var(--yellow); }
.al-d { background: var(--red-bg); color: var(--red); border-color: var(--red); }
.al-i { background: var(--blue-bg); color: var(--blue); border-color: var(--blue); }
.al-s { background: var(--green-bg); color: var(--green); border-color: var(--green); }

/* ══════════════════════════════════════════════════════════════════
   ESTILOS ESPECÍFICOS DE MÓDULOS
   ══════════════════════════════════════════════════════════════════ */
/* COMPRAS / COTAÇÕES */
.cot-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; margin-top: 14px; }
.cot-card { background: var(--card); border: 1.5px solid var(--border2); border-radius: var(--r-lg); padding: 16px; position: relative; transition: all .2s; }
.cot-card:hover { border-color: var(--gold); box-shadow: var(--sh); }
.cot-card.vencedor { border-color: var(--green); border-width: 2px; }
.cot-card.vencedor::after { content: 'VENCEDOR'; position: absolute; top: -10px; right: 10px; background: var(--green); color: #fff; font-size: .6rem; padding: 2px 8px; border-radius: 10px; font-weight: 800; }

/* FINANCEIRO / CONCILIAÇÃO */
.cc-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--border); border-radius: var(--r); overflow: hidden; margin-bottom: 16px; }
.cc-stat { background: var(--card); padding: 12px; text-align: center; }
.cc-stat label { margin-bottom: 2px; }
.cc-stat .val { font-size: 1.1rem; font-weight: 800; font-family: var(--mono); }

/* APROVAÇÕES / FILA */
.fila-card { background: var(--card); border: 1.5px solid var(--border2); border-radius: var(--r-lg); padding: 16px; margin-bottom: 12px; transition: all .2s; border-left: 4px solid var(--border2); }
.fila-card:hover { box-shadow: var(--sh-lg); border-color: var(--gold); }
.fila-card.urgente { border-left-color: var(--red); }
.fila-card.normal { border-left-color: var(--blue); }
.fila-h { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; margin-bottom: 8px; }
.fila-tt { font-weight: 700; font-size: .88rem; }
.fila-meta { display: flex; gap: 10px; font-size: .75rem; color: var(--tx2); flex-wrap: wrap; margin-bottom: 10px; }

/* RELATÓRIOS / GRÁFICOS */
.chart-wrap { background: var(--card); border: 1.5px solid var(--border2); border-radius: var(--r-lg); padding: 20px; margin-bottom: 18px; }
.bar-chart { display: flex; flex-direction: column; gap: 8px; }
.bar-row { display: flex; align-items: center; gap: 10px; }
.bar-label { font-size: .75rem; color: var(--tx2); min-width: 120px; text-align: right; }
.bar-track { flex: 1; height: 26px; background: var(--bg3); border-radius: 4px; overflow: hidden; position: relative; }
.bar-fill { height: 100%; border-radius: 4px; transition: width .6s ease; display: flex; align-items: center; padding-left: 8px; font-size: .72rem; font-weight: 600; color: #fff; white-space: nowrap; }

/* CONFIG / LOGO */
.logo-preview { width: 80px; height: 80px; border-radius: var(--r); border: 2px dashed var(--border); display: flex; align-items: center; justify-content: center; overflow: hidden; background: var(--bg3); cursor: pointer; }
.logo-preview img { width: 100%; height: 100%; object-fit: contain; }

/* UTILS */
.fade { animation: fadeUp 0.25s ease; }
@keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
.empty { text-align: center; padding: 48px 20px; color: var(--tx3); }
.empty-ic { font-size: 2.8rem; margin-bottom: 10px; opacity: 0.35; }

@media(max-width: 768px) { .sb { transform: translateX(-100%); } .sb.open { transform: none; } .mn { margin-left: 0; } .mt { display: flex; width: 34px; height: 34px; border-radius: var(--r-sm); background: var(--bg3); align-items: center; justify-content: center; color: var(--tx2); } }
.mt { display: none; }
</style>
</head>
<body>

<!-- ══════════════════════════════════════════════════════════════════
   SIDEBAR (NAV)
   ══════════════════════════════════════════════════════════════════ -->
<aside class="sb" id="sb">
  <div class="sb-brand">
    <div class="sb-logo" id="sbLogo">EM</div>
    <div class="sb-brand-t"><strong id="sbName">IBEA</strong><span id="sbOrg">Gestão de Emendas</span></div>
  </div>
  <nav class="sb-nav">
    <div class="sb-sec">Núcleo</div>
    <div class="ni act" data-v="dash" onclick="go('dash')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>Dashboard</div>
    <div class="ni" data-v="ems" onclick="go('ems')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14,2 14,8 20,8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>Emendas</div>
    <div class="ni" data-v="plano" onclick="go('plano')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 4h2a2 2 0 012 2v14a2 2 0 01-2 2H6a2 2 0 01-2-2H6a2 2 0 01-2-2V6a2 2 0 012-2h2"/><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M9 14l2 2 4-4"/></svg>Plano de Trabalho</div>
    
    <div class="sb-sec">Suprimentos</div>
    <div class="ni" data-v="cot" onclick="go('cot')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 002 1.61h9.72a2 2 0 002-1.61L23 6H6"/></svg>Cotações</div>
    <div class="ni" data-v="nfs" onclick="go('nfs')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V9z"/><polyline points="13,2 13,9 20,9"/></svg>Notas Fiscais</div>
    
    <div class="sb-sec">Financeiro</div>
    <div class="ni" data-v="fin" onclick="go('fin')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"/></svg>Painel Financeiro</div>
    <div class="ni" data-v="cc" onclick="go('cc')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg>Conta Corrente</div>
    <div class="ni" data-v="pg" onclick="go('pg')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>Pagamentos</div>
    
    <div class="sb-sec">Governança</div>
    <div class="ni" data-v="aprov" onclick="go('aprov')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 11-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>Aprovações <span class="ni-badge" id="badgeAprov">0</span></div>
    <div class="ni" data-v="rel" onclick="go('rel')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.21 15.89A10 10 0 118 2.83"/><path d="M22 12A10 10 0 0012 2v10z"/></svg>Relatórios</div>
    
    <div class="sb-sec">Ajustes</div>
    <div class="ni" data-v="pc" onclick="go('pc')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14,2 14,8 20,8"/></svg>Prestação de Contas</div>
    <div class="ni" data-v="org" onclick="go('org')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>Perfil da Org.</div>
    <div class="ni" data-v="audit" onclick="go('audit')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22,12 18,12 15,21 9,3 6,12 2,12"/></svg>Auditoria</div>
  </nav>
  <div class="sb-ft">v2.0 · Abril 2026</div>
</aside>

<!-- ══════════════════════════════════════════════════════════════════
   MAIN CONTENT
   ══════════════════════════════════════════════════════════════════ -->
<div class="mn">
  <header class="tb">
    <div style="display:flex;align-items:center;gap:10px">
      <button class="mt" onclick="document.getElementById('sb').classList.toggle('open')">☰</button>
      <span class="tb-t" id="tbT">Dashboard</span>
      <button class="btn-h" onclick="showHelp()" title="Ajuda sobre esta tela">?</button>
    </div>
    <div class="tb-a">
      <div class="perfil-chip" onclick="openTrocaPerfil()" id="perfilChip">👤 Admin</div>
      <button class="btn-t" onclick="toggleTheme()" title="Alternar tema">
        <svg id="thIc" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
      </button>
    </div>
  </header>
  <div class="ct" id="ct"></div>
</div>

<!-- ══════════════════════════════════════════════════════════════════
   MODAIS GLOBAIS
   ══════════════════════════════════════════════════════════════════ -->
<div class="mo" id="mo" onclick="if(event.target===this)closeMo()">
  <div class="mo-c">
    <div class="mo-h"><h3 id="moT"></h3><button class="btn-i" onclick="closeMo()">✕</button></div>
    <div class="mo-b" id="moB"></div>
    <div class="mo-f" id="moF"></div>
  </div>
</div>
<div class="mo" id="mo2" style="z-index:210" onclick="if(event.target===this)closeMo2()">
  <div class="mo-c" style="max-width:500px">
    <div class="mo-h"><h3 id="moT2"></h3><button class="btn-i" onclick="closeMo2()">✕</button></div>
    <div class="mo-b" id="moB2"></div>
    <div class="mo-f" id="moF2"></div>
  </div>
</div>

<!-- ══════════════════════════════════════════════════════════════════
   LÓGICA JAVASCRIPT
   ══════════════════════════════════════════════════════════════════ -->
<script>
/* ─── CORE: DATABASE & UTILS ─── */
const DB = {
  _k: ns => 'ibea_' + ns,
  all(ns) { try { return JSON.parse(localStorage.getItem(this._k(ns))) || [] } catch { return [] } },
  sv(ns, d) { localStorage.setItem(this._k(ns), JSON.stringify(d)) },
  one(ns, id) { return this.all(ns).find(x => x.id === id) || null },
  ups(ns, item) {
    const a = this.all(ns), i = a.findIndex(x => x.id === item.id), now = new Date().toISOString();
    if (i >= 0) a[i] = { ...a[i], ...item, _u: now };
    else a.push({ ...item, _c: now, _u: now });
    this.sv(ns, a);
  },
  del(ns, id) { this.sv(ns, this.all(ns).filter(x => x.id !== id)) },
  log(a, d, tipo, val) {
    const usr = JSON.parse(localStorage.getItem('ibea_perfil_ativo') || '{"nome":"Sistema"}').nome;
    const l = this.all('log');
    l.push({ id: uid(), act: a, det: d, tipo: tipo || '', val: val || 0, user: usr, ts: new Date().toISOString() });
    if (l.length > 2000) l.splice(0, l.length - 2000);
    this.sv('log', l);
  }
};
const uid = () => Math.random().toString(36).slice(2, 8) + Date.now().toString(36);
const $ = id => document.getElementById(id);
const F = {
  R: v => (v || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' }),
  P: v => (v || 0).toFixed(1) + '%',
  D: iso => !iso ? '—' : new Date(iso + 'T12:00').toLocaleDateString('pt-BR'),
  DT: iso => !iso ? '—' : new Date(iso).toLocaleString('pt-BR'),
  DL: iso => { if (!iso) return 0; return Math.ceil((new Date(iso) - new Date()) / 864e5) },
  N: v => parseFloat(String(v || '0').replace(/\./g, '').replace(',', '.')) || 0
};
const MASKS = {
  money(el) { el.addEventListener('input', () => { let v = el.value.replace(/\D/g, '') || '0'; el.value = (parseInt(v) / 100).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) }) },
  cnpj(el) { el.addEventListener('input', () => { let v = el.value.replace(/\D/g, '').slice(0, 14); v = v.replace(/^(\d{2})(\d)/, '$1.$2').replace(/\.(\d{3})(\d)/, '.$1.$2').replace(/\.(\d{3})(\d)/, '.$1/$2').replace(/(\d{4})(\d)/, '$1-$2'); el.value = v }) },
  tel(el) { el.addEventListener('input', () => { let v = el.value.replace(/\D/g, '').slice(0, 11); v = v.length <= 10 ? v.replace(/^(\d{2})(\d{4})(\d)/, '($1) $2-$3') : v.replace(/^(\d{2})(\d{5})(\d)/, '($1) $2-$3'); el.value = v }) }
};

/* ─── ROUTER ─── */
let curV = 'dash';
function go(v) {
  curV = v;
  document.querySelectorAll('.ni[data-v]').forEach(n => n.classList.toggle('act', n.dataset.v === v));
  const titles = { dash: 'Dashboard', ems: 'Gestão de Emendas', plano: 'Plano de Trabalho', cot: 'Cotações', nfs: 'Notas Fiscais', fin: 'Painel Financeiro', cc: 'Conta Corrente', pg: 'Pagamentos', aprov: 'Aprovações', rel: 'Análise & Relatórios', pc: 'Prestação de Contas', org: 'Perfil da Organização', audit: 'Auditoria' };
  $('tbT').textContent = titles[v] || '';
  $('sb').classList.remove('open');
  const c = $('ct'); c.innerHTML = ''; c.className = 'ct fade';
  const renderers = { dash: rDash, ems: rEms, plano: rPlano, cot: rCot, nfs: rNFs, fin: rFin, cc: rCC, pg: rPG, aprov: rAprov, rel: rRel, pc: rPC, org: rOrg, audit: rAudit };
  renderers[v]?.(c);
  updateBadges();
}

/* ─── CORE UI FUNCTIONS ─── */
function openMo() { $('mo').classList.add('open') } function closeMo() { $('mo').classList.remove('open') }
function openMo2() { $('mo2').classList.add('open') } function closeMo2() { $('mo2').classList.remove('open') }
function toggleTheme() {
  const d = document.documentElement.getAttribute('data-theme') === 'dark' ? '' : 'dark';
  document.documentElement.setAttribute('data-theme', d);
  localStorage.setItem('ibea_theme', d);
  $('thIc').innerHTML = d === 'dark' ? '<circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>' : '<path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/>';
}
function loadOrgShell() {
  const o = JSON.parse(localStorage.getItem('ibea_cad_org') || '{}');
  if (o.nome) { $('sbName').textContent = o.nome.split(' ').slice(0, 2).join(' '); $('sbOrg').textContent = o.nome; }
  if (o.logos && o.logos[0]) $('sbLogo').innerHTML = '<img src="' + o.logos[0] + '" alt="Logo">';
}
function updateBadges() {
  const a = DB.all('aprovacoes').filter(x => x.status === 'pendente').length;
  $('badgeAprov').textContent = a > 0 ? a : ''; $('badgeAprov').style.display = a > 0 ? '' : 'none';
}

/* ─── DATA CALC ─── */
function calcES(e) {
  const pg = DB.all('pagamentos').filter(p => p.emendaId === e.id), cr = DB.all('creditos').filter(c => c.emendaId === e.id), co = DB.all('comprometidos').filter(c => c.emendaId === e.id), dv = DB.all('devolucoes').filter(d => d.emendaId === e.id), rd = DB.all('rendimentos').filter(r => r.emendaId === e.id);
  const prev = e.valor || 0, rec = cr.reduce((s, c) => s + (c.valor || 0), 0), rend = rd.reduce((s, r) => s + (r.valor || 0), 0), gasto = pg.reduce((s, p) => s + (p.valor || 0), 0), devol = dv.reduce((s, d) => s + (d.valor || 0), 0), comp = co.filter(c => c.status === 'comprometido').reduce((s, c) => s + (c.valor || 0), 0), emp = co.filter(c => c.status === 'empenhado').reduce((s, c) => s + (c.valor || 0), 0);
  return { prev, rec: rec + rend, gasto: gasto + devol, comp, emp, saldo: rec + rend - gasto - devol, disp: prev - gasto - devol - emp - comp, pct: prev > 0 ? ((gasto + devol) / prev * 100) : 0 };
}

/* ═══════════════ MÓDULO: DASHBOARD ═══════════════ */
function rDash(c) {
  const ems = DB.all('emendas'), nfs = DB.all('notas_fiscais'), pgs = DB.all('pagamentos');
  const tPrev = ems.reduce((s, e) => s + (e.valor || 0), 0), tExec = ems.reduce((s, e) => s + calcES(e).gasto, 0);
  const vlrPgsHj = pgs.filter(p => (p.data || '').slice(0, 10) === new Date().toISOString().slice(0, 10)).reduce((s, p) => s + (p.valor || 0), 0);
  c.innerHTML = `
    <div class="kpi-g">
      <div class="kpi clickable" onclick="go('ems')"><div class="kpi-lb">Emendas Ativas</div><div class="kpi-vl">${ems.length}</div></div>
      <div class="kpi"><div class="kpi-lb">Total Previsto</div><div class="kpi-vl">${F.R(tPrev)}</div></div>
      <div class="kpi clickable" onclick="go('rel')"><div class="kpi-lb">Execução Global</div><div class="kpi-vl">${F.P(tPrev > 0 ? tExec / tPrev * 100 : 0)}</div><div class="kpi-sb">${F.R(tExec)} executado</div></div>
      <div class="kpi clickable" onclick="go('pg')"><div class="kpi-lb">Pagamentos Hoje</div><div class="kpi-vl">${F.R(vlrPgsHj)}</div></div>
    </div>
    <div class="sep">📋 Próximos Vencimentos de Vigência</div>
    <div class="tbl-w">
      <table class="tbl"><thead><tr><th>Emenda</th><th>Parlamentar</th><th>Fim Vigência</th><th>Dias Restantes</th><th>Status</th></tr></thead>
      <tbody>${ems.filter(e => e.status !== 'encerrada').sort((a, b) => (a.vigenciaFim || '9').localeCompare(b.vigenciaFim || '9')).slice(0, 5).map(e => { const d = F.DL(e.vigenciaFim); return `<tr><td>${e.codigo || '—'} — ${e.descricao || ''}</td><td>${e.parlamentar || '—'}</td><td>${F.D(e.vigenciaFim)}</td><td><span class="badge ${d <= 30 ? 'b-red' : d <= 60 ? 'b-yellow' : 'b-green'}">${d} dias</span></td><td>${e.status || 'Ativa'}</td></tr>` }).join('')}</tbody>
      </table>
    </div>
  `;
}

/* ═══════════════ MÓDULO: EMENDAS & PLANO ═══════════════ */
function rEms(c) {
  const ems = DB.all('emendas');
  c.innerHTML = `<div style="display:flex;justify-content:space-between;margin-bottom:14px"><h3>Gestão de Emendas</h3><button class="btn btn-p" onclick="openEm()">+ Nova Emenda</button></div>
    <div class="tbl-w"><table class="tbl"><thead><tr><th>Código</th><th>Objeto</th><th>Parlamentar</th><th>Vigência</th><th>Valor</th><th>%</th><th>Ações</th></tr></thead>
    <tbody>${ems.map(e => { const s = calcES(e); return `<tr><td class="mono">${e.codigo || '—'}</td><td>${(e.descricao || '').slice(0, 40)}</td><td>${e.parlamentar || '—'}</td><td>${F.D(e.vigenciaIni)} - ${F.D(e.vigenciaFim)}</td><td class="mono">${F.R(e.valor)}</td><td>${F.P(s.pct)}</td><td><div class="btn-i" onclick="openEm('${e.id}')">✏️</div></td></tr>` }).join('')}</tbody></table></div>`;
}
function openEm(id) {
  const e = id ? DB.one('emendas', id) : {};
  $('moT').textContent = id ? 'Editar Emenda' : 'Nova Emenda';
  $('moB').innerHTML = `
    <div class="g g2"><div class="fld"><label>Código *</label><input id="em_cod" value="${e.codigo || ''}"></div><div class="fld"><label>Parlamentar</label><input id="em_parl" value="${e.parlamentar || ''}"></div></div>
    <div class="fld" style="margin-top:10px"><label>Descrição do Objeto *</label><textarea id="em_desc">${e.descricao || ''}</textarea></div>
    <div class="g g3" style="margin-top:10px"><div class="fld"><label>Vigência Início</label><input type="date" id="em_vini" value="${e.vigenciaIni || ''}"></div><div class="fld"><label>Vigência Fim</label><input type="date" id="em_vfim" value="${e.vigenciaFim || ''}"></div><div class="fld"><label>Valor Total *</label><input id="em_vlr" value="${F.R(e.valor || 0).replace('R$', '').trim()}"></div></div>
  `;
  MASKS.money($('em_vlr'));
  $('moF').innerHTML = `<button class="btn btn-s" onclick="closeMo()">Cancelar</button><button class="btn btn-p" onclick="saveEm('${id || ''}')">Salvar</button>`;
  openMo();
}
function saveEm(id) {
  const em = { id: id || uid(), codigo: $('em_cod').value, parlamentar: $('em_parl').value, descricao: $('em_desc').value, vigenciaIni: $('em_vini').value, vigenciaFim: $('em_vfim').value, valor: F.N($('em_vlr').value) };
  DB.ups('emendas', em); DB.log('emenda_salva', em.codigo); closeMo(); go('ems');
}

function rPlano(c) {
  const ems = DB.all('emendas');
  if (!ems.length) { c.innerHTML = '<div class="empty">Nenhuma emenda para planejar.</div>'; return; }
  c.innerHTML = `<div class="al al-i">Selecione uma emenda para gerenciar rubricas e cronograma do Plano de Trabalho.</div>
    <div class="g g2">${ems.map(e => `<div class="kpi clickable" onclick="openPlano('${e.id}')"><div class="kpi-lb">${e.codigo}</div><div class="kpi-vl" style="font-size:0.9rem">${e.descricao.slice(0,50)}</div></div>`).join('')}</div>`;
}
function openPlano(eid) {
  const e = DB.one('emendas', eid); if (!e) return;
  const rubs = DB.all('rubricas').filter(r => r.emendaId === eid);
  const s = calcES(e);
  $('moT').textContent = 'Plano de Trabalho: ' + e.codigo;
  $('moB').innerHTML = `
    <div class="kpi-g" style="grid-template-columns:1fr 1fr"><div class="kpi"><div class="kpi-lb">Valor Emenda</div><div class="kpi-vl">${F.R(e.valor)}</div></div><div class="kpi"><div class="kpi-lb">Planejado</div><div class="kpi-vl">${F.R(rubs.reduce((s, r) => s + r.valor, 0))}</div></div></div>
    <div class="sep">📦 Rubricas <button class="btn btn-s btn-sm" onclick="addRub('${eid}')">+ Nova</button></div>
    <div class="tbl-w"><table class="tbl"><thead><tr><th>Descrição</th><th>Tipo</th><th>Valor</th><th>Ações</th></tr></thead>
    <tbody>${rubs.map(r => `<tr><td>${r.descricao}</td><td>${r.tipo}</td><td class="mono">${F.R(r.valor)}</td><td><div class="btn-i" onclick="delRub('${r.id}')">🗑️</div></td></tr>`).join('')}</tbody></table></div>
  `;
  $('moF').innerHTML = `<button class="btn btn-s" onclick="closeMo()">Fechar</button>`;
  openMo();
}
function addRub(eid) {
  const desc = prompt('Descrição da rubrica:'); if (!desc) return;
  const vlr = F.N(prompt('Valor:')); if (!vlr) return;
  DB.ups('rubricas', { id: uid(), emendaId: eid, descricao: desc, valor: vlr, tipo: 'MC' }); openPlano(eid);
}
function delRub(id) { if (confirm('Excluir rubrica?')) { const rid = DB.one('rubricas', id).emendaId; DB.del('rubricas', id); openPlano(rid); } }

/* ═══════════════ MÓDULO: COMPRAS ═══════════════ */
function rCot(c) {
  const cots = DB.all('cotacoes').reverse();
  c.innerHTML = `<div style="display:flex;justify-content:space-between;margin-bottom:14px"><h3>Cotações de Preços</h3><button class="btn btn-p" onclick="newCot()">+ Nova Cotação</button></div>
    ${cots.length === 0 ? '<div class="empty">Nenhuma cotação.</div>' : cots.map(ct => `<div class="fila-card normal"><div class="fila-h"><div class="fila-tt">${ct.descricao}</div><span class="badge ${ct.status === 'aprovada' ? 'b-green' : 'b-yellow'}">${ct.status || 'pendente'}</span></div>
      <div class="fila-meta"><span>📅 ${F.D(ct._c)}</span><span>💰 Menor: ${F.R(Math.min(...(ct.orcamentos || []).map(o => o.valor || Infinity)))}</span></div>
      <div class="fila-ac"><button class="btn btn-s btn-sm" onclick="showCot('${ct.id}')">Ver Detalhes</button></div></div>`).join('')}`;
}
function newCot() {
  const d = prompt('Descrição/Objeto da compra:'); if (!d) return;
  const eid = DB.all('emendas')[0]?.id; if (!eid) { alert('Cadastre uma emenda primeiro.'); return; }
  DB.ups('cotacoes', { id: uid(), descricao: d, emendaId: eid, status: 'pendente', orcamentos: [] }); go('cot');
}
function showCot(id) {
  const ct = DB.one('cotacoes', id); if (!ct) return;
  $('moT').textContent = 'Cotação: ' + ct.descricao;
  $('moB').innerHTML = `
    <div class="al al-i">Anexe pelo menos 3 orçamentos para cumprir a regra de menor preço.</div>
    <div class="cot-grid">${(ct.orcamentos || []).map((o, i) => `<div class="cot-card ${o.vencedor ? 'vencedor' : ''}"><strong>${o.fornecedor}</strong><div class="mono" style="margin:5px 0">${F.R(o.valor)}</div><div class="btn-i" onclick="delOrc('${id}', ${i})">🗑️</div></div>`).join('')}
    <div class="cot-card" style="border:2px dashed var(--border); display:flex; align-items:center; justify-content:center; cursor:pointer" onclick="addOrc('${id}')">+ Adicionar</div></div>
  `;
  $('moF').innerHTML = `<button class="btn btn-s" onclick="closeMo()">Fechar</button>`;
  openMo();
}
function addOrc(id) {
  const f = prompt('Fornecedor:'); if (!f) return;
  const v = F.N(prompt('Valor:')); if (!v) return;
  const ct = DB.one('cotacoes', id); ct.orcamentos.push({ fornecedor: f, valor: v });
  // auto-vencedor (menor preço)
  const min = Math.min(...ct.orcamentos.map(o => o.valor));
  ct.orcamentos.forEach(o => o.vencedor = o.valor === min);
  DB.ups('cotacoes', ct); showCot(id);
}

function rNFs(c) {
  const nfs = DB.all('notas_fiscais').reverse();
  c.innerHTML = `<h3>Notas Fiscais</h3><div class="tbl-w"><table class="tbl"><thead><tr><th>NF</th><th>Fornecedor</th><th>Data</th><th>Valor</th><th>Status</th></tr></thead>
    <tbody>${nfs.map(n => `<tr><td>${n.numNF}</td><td>${n.fornecedor}</td><td>${F.D(n.dataNF)}</td><td class="mono">${F.R(n.valor)}</td><td><span class="badge ${n.status === 'paga' ? 'b-green' : 'b-yellow'}">${n.status || 'pendente'}</span></td></tr>`).join('')}</tbody></table></div>`;
}

/* ═══════════════ MÓDULO: FINANCEIRO ═══════════════ */
function rFin(c) {
  const ems = DB.all('emendas');
  c.innerHTML = `<div class="kpi-g">${ems.map(e => { const s = calcES(e); return `<div class="kpi"><div class="kpi-lb">${e.codigo}</div><div class="kpi-vl">${F.R(s.saldo)}</div><div class="kpi-sb">Disp: ${F.R(s.disp)}</div></div>` }).join('')}</div>`;
}
function rCC(c) {
  const cre = DB.all('creditos'), pag = DB.all('pagamentos');
  const all = [...cre.map(x => ({ ...x, t: 'C' })), ...pag.map(x => ({ ...x, t: 'D' }))].sort((a, b) => b.ts.localeCompare(a.ts));
  c.innerHTML = `<h3>Extrato Bancário Unificado</h3><div class="tbl-w"><table class="tbl"><thead><tr><th>Data</th><th>Lançamento</th><th>Emenda</th><th>Valor</th></tr></thead>
    <tbody>${all.map(x => `<tr><td>${F.D(x.data)}</td><td>${x.descricao || (x.t === 'C' ? 'Crédito' : 'Pagamento NF ' + x.numNF)}</td><td>${DB.one('emendas', x.emendaId)?.codigo || ''}</td><td class="mono" style="color:${x.t === 'C' ? 'var(--green)' : 'var(--red)'}">${x.t === 'C' ? '+' : '-'}${F.R(x.valor)}</td></tr>`).join('')}</tbody></table></div>`;
}
function rPG(c) {
  const nfs = DB.all('notas_fiscais').filter(n => n.status !== 'paga');
  c.innerHTML = `<h3>Pagamentos Pendentes</h3><div class="g g2">${nfs.map(n => `<div class="fila-card urgente"><div class="fila-h"><div>NF ${n.numNF} - ${n.fornecedor}</div><strong>${F.R(n.valor)}</strong></div><button class="btn btn-green btn-sm" onclick="execPG('${n.id}')">Efetuar Pagamento</button></div>`).join('')}</div>`;
}
function execPG(id) {
  if (!confirm('Confirmar pagamento?')) return;
  const nf = DB.one('notas_fiscais', id); nf.status = 'paga'; DB.ups('notas_fiscais', nf);
  DB.ups('pagamentos', { id: uid(), emendaId: nf.emendaId, rubricaId: nf.rubricaId, valor: nf.valor, data: new Date().toISOString().slice(0, 10), numNF: nf.numNF, fornecedor: nf.fornecedor, ts: new Date().toISOString() });
  DB.log('pagamento', 'NF ' + nf.numNF, 'db', nf.valor); go('pg');
}

/* ═══════════════ MÓDULO: GOVERNANÇA ═══════════════ */
function rAprov(c) {
  const aps = DB.all('aprovacoes').filter(x => x.status === 'pendente');
  c.innerHTML = `<h3>Fila de Aprovações</h3>${aps.length === 0 ? '<div class="empty">Tudo em dia! Nenhuma pendência.</div>' : aps.map(a => `<div class="fila-card normal"><div class="fila-h"><div>${a.tipo} - ${a.descricao}</div><strong>${F.R(a.valor)}</strong></div><div class="fila-ac"><button class="btn btn-green btn-sm" onclick="doAprov('${a.id}', true)">Aprovar</button><button class="btn btn-red btn-sm" onclick="doAprov('${a.id}', false)">Rejeitar</button></div></div>`).join('')}`;
}
function doAprov(id, ok) {
  const ap = DB.one('aprovacoes', id); ap.status = ok ? 'aprovado' : 'rejeitado'; DB.ups('aprovacoes', ap);
  if (ok && ap.tipo === 'cotacao') { const ct = DB.one('cotacoes', ap.refId); ct.status = 'aprovada'; DB.ups('cotacoes', ct); }
  go('aprov');
}

function rRel(c) {
  const ems = DB.all('emendas');
  c.innerHTML = `<h3>Relatório de Execução</h3><div class="chart-wrap">
    ${ems.map(e => { const s = calcES(e); return `<div class="bar-row"><div class="bar-label">${e.codigo}</div><div class="bar-track"><div class="bar-fill" style="width:${Math.min(s.pct, 100)}%;background:var(--blue)">${F.P(s.pct)}</div></div></div>` }).join('')}
  </div>`;
}

/* ═══════════════ MÓDULO: CONFIGURAÇÕES ═══════════════ */
function rOrg(c) {
  const o = JSON.parse(localStorage.getItem('ibea_cad_org') || '{}');
  c.innerHTML = `<h3>Perfil da Organização</h3><div class="g g2">
    <div class="fld"><label>Razão Social</label><input id="o_nome" value="${o.nome || ''}"></div>
    <div class="fld"><label>CNPJ</label><input id="o_cnpj" value="${o.cnpj || ''}"></div>
    <div class="fld"><label>E-mail</label><input id="o_email" value="${o.email || ''}"></div>
    <div class="fld"><label>Logo (Base64)</label><input type="file" onchange="upLogo(this)"></div>
    </div><button class="btn btn-p" style="margin-top:14px" onclick="svOrg()">Salvar</button>`;
}
function svOrg() {
  const o = JSON.parse(localStorage.getItem('ibea_cad_org') || '{}');
  o.nome = $('o_nome').value; o.cnpj = $('o_cnpj').value; o.email = $('o_email').value;
  localStorage.setItem('ibea_cad_org', JSON.stringify(o)); loadOrgShell(); alert('Salvo!');
}
function upLogo(inp) {
  const f = inp.files[0]; if (!f) return;
  const r = new FileReader(); r.onload = e => { const o = JSON.parse(localStorage.getItem('ibea_cad_org') || '{}'); o.logos = [e.target.result]; localStorage.setItem('ibea_cad_org', JSON.stringify(o)); loadOrgShell(); };
  r.readAsDataURL(f);
}

function rAudit(c) {
  const logs = DB.all('log').reverse();
  c.innerHTML = `<div class="tbl-w"><table class="tbl"><thead><tr><th>Hora</th><th>Usuário</th><th>Ação</th><th>Detalhe</th><th>Valor</th></tr></thead>
    <tbody>${logs.slice(0, 100).map(l => `<tr><td>${F.DT(l.ts)}</td><td>${l.user}</td><td>${l.act}</td><td>${l.det}</td><td>${l.val ? F.R(l.val) : '—'}</td></tr>`).join('')}</tbody></table></div>`;
}

function rPC(c) {

}
